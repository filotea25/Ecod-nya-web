<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../output.css">
    <title>Nuestros Productos | EcoDünya</title>
</head>

<body class="bg-white">

<div class="grid grid-cols-12 grid-rows-[200px_auto] min-h-screen">

    <!-- HEADER -->
    <header class="col-span-12 bg-gradient-to-r from-teal-400 to-teal-700 text-white 
                   rounded-bl-[60px] grid grid-cols-3 grid-rows-2 px-6 py-4">

        <!-- Botón volver -->
        <div class="col-start-1 row-start-1 place-self-start">
            <a href="./index.html"
               class="bg-white text-teal-700 px-4 py-2 rounded-full shadow hover:bg-teal-100 transition duration-300">
                ← Volver
            </a>
        </div>

        <!-- Carrito -->
        <div class="col-start-3 row-start-1 justify-self-end relative">
            <button class="bg-white text-teal-700 p-3 rounded-full shadow hover:bg-teal-100 transition duration-300 relative">
                🛒
                <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 grid place-items-center rounded-full">
                    0
                </span>
            </button>
        </div>

        <!-- Texto central -->
        <div class="col-span-3 row-start-2 place-self-center text-center">
            <h1 class="text-3xl md:text-4xl font-bold animate-pulse">
                Nuestros productos ecológicos
            </h1>
        </div>

    </header>

    <!-- ASIDE -->
    <aside class="col-span-3 p-6">
        <div class="bg-gradient-to-br from-teal-200/70 to-teal-50/60
                    backdrop-blur-md
                    border border-white/40
                    rounded-2xl
                    shadow-md
                    p-8
                    h-fit
                    transition duration-300
                    hover:shadow-xl
                    hover:scale-[1.02]">

            <h2 class="text-xl font-semibold text-teal-900 mb-6">
                Categorías
            </h2>

            <ul class="space-y-4 text-teal-800">
                <li class="hover:text-teal-950 hover:translate-x-1 transition cursor-pointer">Hogar</li>
                <li class="hover:text-teal-950 hover:translate-x-1 transition cursor-pointer">Supermercado</li>
                <li class="hover:text-teal-950 hover:translate-x-1 transition cursor-pointer">Ropa</li>
                <li class="hover:text-teal-950 hover:translate-x-1 transition cursor-pointer">Ferretería</li>
                <li class="hover:text-teal-950 hover:translate-x-1 transition cursor-pointer">Invernadero</li>
            </ul>

        </div>
    </aside>

    <!-- Espacio blanco separador -->
    <div class="col-span-1"></div>

    <!-- MAIN -->
    <main class="col-span-8 p-10 bg-white">
        <div class="grid md:grid-cols-3 gap-10">

            <!-- TARJETA -->
            <div class="bg-gradient-to-br from-white/80 to-teal-50/40
                        backdrop-blur-md
                        border border-white/40
                        rounded-2xl
                        shadow-md
                        overflow-hidden
                        transition duration-300
                        hover:shadow-xl
                        hover:scale-[1.02]">

                <div class="overflow-hidden">
                    <img src="./cepillo.webp"
                         class="w-full h-48 object-cover transition duration-500 hover:scale-110">
                </div>

                <div class="p-5 grid gap-4">
                    <h3 class="font-semibold text-gray-800">Cepillo de madera</h3>
                    <button class="bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition duration-300">
                        Añadir al carrito
                    </button>
                </div>
            </div>

            <!-- TARJETA -->
            <div class="bg-gradient-to-br from-white/80 to-teal-50/40 backdrop-blur-md border border-white/40 rounded-2xl shadow-md overflow-hidden transition duration-300 hover:shadow-xl hover:scale-[1.02]">
                <div class="overflow-hidden">
                    <img src="./bolsam.avif" class="w-full h-48 object-cover transition duration-500 hover:scale-110">
                </div>
                <div class="p-5 grid gap-4">
                    <h3 class="font-semibold text-gray-800">Bolsa reutilizable</h3>
                    <button class="bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition duration-300">
                        Añadir al carrito
                    </button>
                </div>
            </div>

            <!-- TARJETA -->
            <div class="bg-gradient-to-br from-white/80 to-teal-50/40 backdrop-blur-md border border-white/40 rounded-2xl shadow-md overflow-hidden transition duration-300 hover:shadow-xl hover:scale-[1.02]">
                <div class="overflow-hidden">
                    <img src="./botellae.avif" class="w-full h-48 object-cover transition duration-500 hover:scale-110">
                </div>
                <div class="p-5 grid gap-4">
                    <h3 class="font-semibold text-gray-800">Botella ecológica</h3>
                    <button class="bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition duration-300">
                        Añadir al carrito
                    </button>
                </div>
            </div>

        </div>
    </main>

</div>

</body>
</html>
