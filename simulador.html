        <h1>Simulador de huella de plástico</h1>
        <section class="intro">
           
        <div class="form-simula">
            <h2 >Averigua la cantidad de plástico que consumes</h2><br>
        <div class="contenedor-registro">
        
        <form>
            <div class="campo">
                <label for="c-botellas">
                ¿Cuántas botellas de agua/refresco de plástico compras a la semana?
                </label>
                <input type="number" id="botellas" name="botellas">
            </div>
            <div class="campo">
                <label for="envasesc">
                    ¿Cuántas veces a la semana usas envases de comida para llevar o delivery?</label>
                    
                <input type="number" id="envaces" name="envaces">
            </div>
            <div class="campo">
                <label for="bastoncillos">
                    ¿Usas bastoncillos de algodón o envases de champú/jabón desechables?
                </label>
                <div class="opciones">
                        <label for="q3-si" class="opcion-tarjeta">
                            <input type="radio" id="q3-si" name="bastoncillos" value="si-bastonsillo" required>
                            <span>Sí</span>
                        </label>
                        <label for="q3-no">
                            <input type="radio" id="p3-no" name="bastoncillos" value="no-bastonsillo" required>
                            <span>No</span>
                        </label>

                    </div>
            </div>
            <div class="campo">
                <label for="bolsas">
                   ¿Cuántas bolsas de supermercado de plástico usas al mes?</label>
                    
                <input type="number" id="bolsas" name="bolsas">
            </div>
            <div class="campo">
                <label for="frecuencia">
                   ¿Con qué frecuencia compras productos con exceso de blíster o embalaje de plástico?
                </label>
                <div class="escala-contenedor">
                    <label for="frec-1" class="escala-opcion">
                        <input type="radio" name="frecuencia_blister" id="frec-1" value="1" required>
                        <span>1</span>
                    </label>
                    <label for="frec-2" class="escala-opcion">
                        <input type="radio" name="frecuencia_blister" id="frec-2" value="2" required>
                        <span>2</span>
                    </label>
                    <label for="frec-5" class="escala-opcion">
                        <input type="radio" name="frecuencia_blister" id="frec-5" value="5" required>
                        <span>5</span>
                    </label>
                </div>
            </div>

            
            <button type="submit" class="boton-calculo">CALCULAR HUELLA</button>
        </form>
    </main>
